[package]
name = "wt-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wt-common = { path = "../../crates/wt-common" }
wt-core = { path = "../../crates/wt-core" }
wt-store = { path = "../../crates/wt-store" }
wt-import = { path = "../../crates/wt-import" }
wt-term = { path = "../../crates/wt-term" }
wt-ipc = { path = "../../crates/wt-ipc" }
wt-ssh = { path = "../../crates/wt-ssh" }
wt-crypto = { path = "../../crates/wt-crypto" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
base64 = { workspace = true }
zeroize = { workspace = true }
# SFTP 连接复用要一把异步互斥锁（`SEC-002` AC-2）：`std::sync::Mutex` 的守卫不能跨
# await，而这里必须跨住整个请求。只用 `sync` 特性，不引入运行时。
tokio = { workspace = true }
# 内嵌编辑器的编码识别/切换（`FIL-011`）：与终端共用同一套编码库
encoding_rs = "0.8"
# 数本地 shell 的子孙进程，判断「有没有前台命令在跑」（`TER-018` 关标签确认）。
# 选它而不是自己写 Win32/procfs：三平台一套代码，且我们的 crate 都是 forbid(unsafe_code)。
sysinfo = "0.32"

[features]
# 端到端验收用：在应用内起一个进程内 SSH 服务端，让界面真的去连一台「服务器」。
# 生产构建不开启，mock 服务端代码不会进二进制。
e2e-mock = ["wt-ssh/test-util"]
