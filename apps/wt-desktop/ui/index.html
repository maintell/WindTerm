<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>WindTerm</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      :root {
        --bg: #1a1a1c;
        --fg: #e8e8ea;
        --muted: #9a9aa0;
        --accent: #5b9bff;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 10px;
        border-bottom: 1px solid #33333a;
        font-size: 12px;
        color: var(--muted);
        flex: none;
      }
      #bar input,
      #bar button {
        background: #2a2a30;
        color: var(--fg);
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 3px 8px;
        font: inherit;
      }
      #bar input { width: 112px; }
      #bar #port { width: 56px; }
      #bar #password { width: 120px; }
      #bar button { cursor: pointer; }
      #bar button:hover { border-color: var(--accent); }
      #bar input:focus { outline: 1px solid var(--accent); }
      #bar button:disabled { opacity: 0.45; cursor: default; border-color: #3a3a44; }
      #status { margin-left: auto; }
      #remember-toggle,
      #key-toggle,
      #agent-toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; }
      #remember-toggle input,
      #key-toggle input,
      #agent-toggle input { width: auto; }
      #vault-row {
        display: flex;
        gap: 6px;
        align-items: center;
        width: 100%;
        font-size: 12px;
      }
      #vault-row[hidden] { display: none; }
      #vault-row #master-pass { width: 150px; }
      #vault-row #vault-state { color: var(--muted); }
      #key-row {
        display: flex;
        gap: 6px;
        align-items: center;
        width: 100%;
        font-size: 12px;
      }
      #key-row[hidden] { display: none; }
      #key-row #key-name { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #key-row #key-pass { width: 150px; }
      #main { flex: 1; display: flex; min-height: 0; }
      #tree {
        width: 190px;
        flex: none;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid #33333a;
      }
      #tree-head {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 4px 6px;
        border-bottom: 1px solid #2a2a30;
      }
      #tree-head button {
        background: #2a2a30;
        color: var(--fg);
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 1px 8px;
        font: inherit;
        cursor: pointer;
      }
      #tree-head button:hover { border-color: var(--accent); }
      #tree-body { flex: 1; overflow: auto; padding: 4px 0; }
      #tree-filter-row { padding: 4px 6px; }
      #tree-filter-row input {
        width: 100%;
        background: #2a2a30;
        color: var(--fg);
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 2px 6px;
        font: inherit;
        font-size: 12px;
      }
      #tree-filter-row input:focus { outline: 1px solid var(--accent); }
      #files {
        border-top: 1px solid #2a2a30;
        max-height: 55%;
        display: flex;
        flex-direction: column;
        min-height: 0;
        font-size: 12px;
      }
      #files[hidden] { display: none; }
      #files-head,
      #files-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 6px;
        color: var(--muted);
      }
      #files-head { border-bottom: 1px solid #2a2a30; }
      #files-foot { border-top: 1px solid #2a2a30; }
      #files-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #files button {
        background: #2a2a30;
        color: var(--fg);
        border: 1px solid #3a3a44;
        border-radius: 3px;
        padding: 0 6px;
        font: inherit;
        cursor: pointer;
      }
      #files button:hover { border-color: var(--accent); }
      #files-list { flex: 1; overflow: auto; }
      #files-list .row { display: flex; gap: 8px; padding: 1px 8px; white-space: nowrap; }
      #files-list .row.name { cursor: pointer; }
      #files-list .row:hover { background: #24242a; }
      #files-list .row span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      #vault-panel {
        border-bottom: 1px solid #2a2a30;
        padding: 4px 0;
        font-size: 12px;
        max-height: 40%;
        overflow: auto;
      }
      #vault-panel[hidden] { display: none; }
      #vault-panel .entry {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        color: var(--fg);
      }
      #vault-panel .entry span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #vault-panel .entry button {
        background: none;
        border: 1px solid #3a3a44;
        border-radius: 3px;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        padding: 0 6px;
      }
      #vault-panel .entry button:hover { border-color: #d06c6c; color: #e8e8ea; }
      #vault-panel .empty { color: var(--muted); padding: 2px 8px; }
      .node {
        padding: 2px 8px;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .node.folder { color: var(--muted); }
      .node.session { cursor: pointer; }
      .node.session:hover { background: #24242a; }
      #tree-empty { color: var(--muted); font-size: 12px; padding: 6px 8px; margin: 0; white-space: pre-wrap; }
      #tree-msg {
        margin: 0;
        padding: 6px 8px;
        font-size: 12px;
        color: var(--muted);
        border-bottom: 1px solid #2a2a30;
        white-space: pre-wrap;
      }
      #tree-msg[hidden] { display: none; }
      /* xterm 需要容器有确定尺寸：flex:1 撑开，min-height/min-width:0 防止被内容顶住
         （没有 min-width:0 时，终端元素自身的宽度会成为下限，侧栏一变宽终端就不肯收窄） */
      #right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
      #tabs {
        display: flex;
        gap: 2px;
        padding: 2px 4px 0;
        overflow-x: auto;
        border-bottom: 1px solid #33333a;
        flex: none;
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        font-size: 12px;
        color: var(--muted);
        background: #24242a;
        border: 1px solid #33333a;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.active { color: var(--fg); background: #2f2f38; }
      .tab .x { color: #8a8a92; }
      .tab .x:hover { color: #e8e8ea; }
      #term { flex: 1; min-width: 0; min-height: 0; position: relative; }
      #find-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px;
        border-bottom: 1px solid #2a2a30;
        font-size: 12px;
        flex: none;
      }
      #find-bar[hidden] { display: none; }
      #find-bar input {
        background: #2a2a30;
        color: var(--fg);
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 2px 8px;
        font: inherit;
        width: 200px;
      }
      #find-bar button {
        background: #2a2a30;
        color: var(--fg);
        border: 1px solid #3a3a44;
        border-radius: 4px;
        padding: 1px 8px;
        font: inherit;
        cursor: pointer;
      }
      #find-bar button:hover { border-color: var(--accent); }
      #find-count { color: var(--muted); min-width: 48px; }
      /* 每个会话一个绝对定位的视图；切走的只是隐藏，xterm 实例与滚动位置都留着 */
      .term-view { position: absolute; inset: 0; padding: 4px 0 0 6px; display: none; }
      .term-view.active { display: block; }
    </style>
  </head>
  <body>
    <div id="bar">
      <input id="session-name" placeholder="会话名称" spellcheck="false" />
      <input id="host" placeholder="主机" spellcheck="false" />
      <input id="port" placeholder="端口" value="22" inputmode="numeric" />
      <input id="user" placeholder="用户名" spellcheck="false" />
      <input id="password" type="password" placeholder="密码" />
      <label id="remember-toggle"><input type="checkbox" id="remember" />记住密码</label>
      <label id="key-toggle"><input type="checkbox" id="use-key" />用密钥</label>
      <label id="agent-toggle"><input type="checkbox" id="use-agent" />用 agent</label>
      <button id="ssh">连接 SSH</button>
      <button id="save-session">保存</button>
      <button id="open">新建本地终端</button>
      <button id="close" disabled>关闭</button>
      <span id="status">未连接</span>
      <div id="key-row" hidden>
        <button id="pick-key">选择密钥…</button>
        <span id="key-name">未选择</span>
        <input id="key-pass" type="password" placeholder="密钥口令（可空）" />
      </div>
      <div id="vault-row" hidden>
        <input id="master-pass" type="password" placeholder="主密码" />
        <button id="vault-open">创建</button>
        <button id="vault-lock" disabled>锁定</button>
        <span id="vault-state">保险库未创建</span>
      </div>
      <input id="key-file" type="file" hidden />
    </div>
    <div id="main">
      <aside id="tree">
        <div id="tree-head">
          <button id="vault-toggle" title="查看保险库里保存的密码">保险库</button>
          <button id="files-toggle" title="打开 SFTP 文件面板">文件</button>
          <button id="delete-session" disabled title="删除选中的会话">删除</button>
          <button id="import" title="从 MobaXterm.ini 导入会话">导入</button>
          <button id="refresh" title="重新读取会话库">刷新</button>
        </div>
        <div id="vault-panel" hidden></div>
        <p id="tree-msg" hidden></p>
        <div id="tree-filter-row">
          <input id="tree-filter" placeholder="过滤会话" spellcheck="false" />
        </div>
        <div id="tree-body"><p id="tree-empty">正在读取会话库…</p></div>
        <div id="files" hidden>
          <div id="files-head">
            <span id="files-path">/</span>
            <button id="files-up" title="上一级">↑</button>
            <button id="files-upload-btn" title="上传本地文件到当前目录">上传</button>
            <button id="files-refresh" title="刷新">⟳</button>
          </div>
          <div id="files-list"></div>
          <div id="files-foot"><span id="files-msg"></span></div>
          <input id="files-upload" type="file" multiple hidden />
        </div>
        <input id="import-file" type="file" accept=".ini,text/plain" hidden />
      </aside>
      <div id="right">
        <div id="tabs"></div>
        <div id="find-bar" hidden>
          <input id="find-input" placeholder="查找（Ctrl+F）" spellcheck="false" />
          <span id="find-count"></span>
          <button id="find-prev" title="上一个">↑</button>
          <button id="find-next" title="下一个">↓</button>
          <button id="find-close" title="关闭（Esc）">×</button>
        </div>
        <div id="term"></div>
      </div>
    </div>
    <script src="vendor/xterm.js"></script>
    <script src="vendor/addon-fit.js"></script>
    <script src="vendor/addon-search.js"></script>
    <script src="main.js"></script>
  </body>
</html>
