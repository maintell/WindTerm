[package]
name = "wt-ssh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# 打开后导出 `testing::MockSshServer`，供上层测试用
test-util = []

[dependencies]
wt-common = { path = "../wt-common" }
wt-term = { path = "../wt-term" }
sha2 = { workspace = true }
sha1 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
russh = { workspace = true }
# 与 russh 依赖的版本**必须一致**，否则 `PrivateKey` 会变成两个不同的类型
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519"] }
